<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Mobile Bridge</title><style>body{font:15px system-ui;margin:40px;color:#202631}button{margin-right:8px;padding:8px 14px}.status{margin-top:20px;white-space:pre-wrap;background:#f2f4f7;padding:16px}</style><h1>Mobile Bridge</h1><button onclick="run('Snapshot')">刷新状态</button><button onclick="run('Start')">启动网关</button><button onclick="run('Stop')">停止网关</button><pre id="status" class="status">Go/Wails 控制器已启动</pre><script>async function run(name){try{const service=window.go?.main?.GatewayService;if(!service){document.querySelector('#status').textContent='Wails service binding unavailable';return}const value=await service[name]();document.querySelector('#status').textContent=JSON.stringify(value,null,2)}catch(error){document.querySelector('#status').textContent=error?.message||String(error)}}</script></html>
