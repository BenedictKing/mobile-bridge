<!doctype html><html lang="zh-CN"><meta charset="utf-8"><title>Mobile Bridge</title><style>body{font:15px system-ui;margin:40px;color:#202631;background:#f7f8fa}main{max-width:900px;margin:auto;background:white;border:1px solid #e1e5ea;border-radius:16px;padding:28px;box-shadow:0 8px 30px #16203312}button{margin:0 8px 8px 0;padding:9px 15px;border:1px solid #c8d0da;border-radius:8px;background:#fff;cursor:pointer}button.primary{background:#1769e0;color:#fff;border-color:#1769e0}.status{margin-top:20px;white-space:pre-wrap;background:#f2f4f7;border-radius:10px;padding:16px;min-height:180px;overflow:auto}.meta{color:#5b6572;font-size:13px;line-height:1.6}</style><main><h1>Mobile Bridge</h1><p class="meta" id="meta">Go/Wails 控制器正在加载…</p><div><button class="primary" onclick="run('Snapshot')">刷新状态</button><button onclick="run('Start')">启动网关</button><button onclick="run('Stop')">停止网关</button></div><pre id="status" class="status">Go/Wails 控制器已启动</pre></main><script>const service=()=>window.go?.main?.GatewayService;async function run(name){try{const api=service();if(!api){document.querySelector('#status').textContent='Wails service binding unavailable';return}const value=await api[name]();document.querySelector('#status').textContent=JSON.stringify(value,null,2)}catch(error){document.querySelector('#status').textContent=error?.message||String(error)}}async function boot(){try{const api=service();if(!api)return;const info=await api.Info();document.querySelector('#meta').textContent='网关：'+info.gateway+'\n数据目录：'+info.dataDir;await run('Snapshot')}catch(error){document.querySelector('#status').textContent=error?.message||String(error)}}boot();</script></html>
