plugins {
    alias libs.plugins.android.application
}

android {
    namespace 'com.mobilebridge.app'
    compileSdk 37

    defaultConfig {
        applicationId 'com.mobilebridge.app'
        minSdk 26
        targetSdk 36
        versionCode 2
        versionName '0.2.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    testImplementation libs.junit
    testImplementation libs.json
}
