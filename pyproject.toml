[project]
name = "mobile-bridge"
version = "0.1.0"
requires-python = ">=3.9"
# 网关本体只使用标准库；可选能力见下方依赖组，uv sync 按组安装。
dependencies = []

[dependency-groups]
# 源码运行的可选能力：SSH 服务器连接与系统凭据存储（Tunnel Token、SSH 密码）
desktop = [
    "paramiko==4.0.0",
    "keyring==25.6.0",
]
# 仅构建打包桌面运行时需要
build = [
    "pyinstaller==6.20.0",
    "certifi==2026.7.22",
]

[tool.uv]
# 裸 uv sync / uv run 即包含源码运行所需的可选能力；打包再加 --group build
default-groups = ["desktop"]
