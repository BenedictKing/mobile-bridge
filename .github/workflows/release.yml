# 网关发布流水线：推送 v* tag 触发，tag 必须与根目录 VERSION 一致。
# 产物为五平台网关二进制 + SHA256SUMS（Electron 桌面壳已移除，构建走 Go）。
name: Gateway release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      publish:
        description: Publish after verification (run this workflow on an existing version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify release identity
        run: |
          expected="refs/tags/v$(sed 's/^v//' VERSION)"
          if [ "$GITHUB_REF" != "$expected" ]; then
            echo "tag 必须与 VERSION 一致：期望 $expected，实际 $GITHUB_REF" >&2
            exit 1
          fi
  build:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Cross-compile gateway binaries
        run: make build-matrix
      - name: Generate checksums
        run: cd dist && sha256sum gateway-* > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: gateway-release
          path: |
            dist/gateway-*
            dist/SHA256SUMS.txt
  release:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: gateway-release
          merge-multiple: true
          path: dist/release
      - name: Upload draft then publish complete release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          PUBLISH: ${{ github.event_name == 'push' || inputs.publish }}
        run: |
          flags=()
          if [[ "$TAG" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "$TAG" dist/release/* --verify-tag --draft --title "$TAG" --notes-file RELEASE_NOTES.md "${flags[@]}"
          if [[ "$PUBLISH" == true ]]; then gh release edit "$TAG" --draft=false; fi
