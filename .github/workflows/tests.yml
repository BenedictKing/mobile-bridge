name: Go tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: iOS channel Cookie transactions
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -swift-version 5 -module-cache-path "$RUNNER_TEMP/bridge-swift-cache" \
            mobile/ios/BridgePreview/ChannelCookieMove.swift mobile/ios/tests/ChannelCookieMoveTests.swift \
            -o "$RUNNER_TEMP/bridge-cookie-tests"
          "$RUNNER_TEMP/bridge-cookie-tests"
      - name: iOS offline history
        if: runner.os == 'macOS'
        run: |
          xcrun swiftc -swift-version 5 -module-cache-path "$RUNNER_TEMP/bridge-swift-cache" \
            mobile/ios/BridgePreview/GatewayURL.swift mobile/ios/BridgePreview/OfflineHistory.swift \
            mobile/ios/tests/OfflineHistoryTests.swift -o "$RUNNER_TEMP/bridge-offline-tests"
          "$RUNNER_TEMP/bridge-offline-tests"

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run check:web

  conformance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go build -o dist/gateway-go ./cmd/gateway
      - run: python3 conformance/http/run.py --verify --target go

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - run: chmod +x gradlew && ./gradlew :app:testDebugUnitTest :app:assembleDebug
        working-directory: android
